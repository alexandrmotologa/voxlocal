[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxlocal"
version = "0.1.0"
description = "100% offline ambient audio intelligence and meeting copilot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandru Motologa", email = "alexandru@motologa.com" },
]
keywords = [
    "whisper",
    "speech-to-text",
    "offline-ai",
    "audio-capture",
    "meeting-assistant",
    "transcription",
    "ollama",
    "obsidian",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "soundcard>=0.4.3",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
voxlocal = "voxlocal.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/voxlocal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "DTZ005"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
